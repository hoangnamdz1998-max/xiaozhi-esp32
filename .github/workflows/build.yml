name: Build Freenove Board

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Freenove 2.8 LCD
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          python scripts/build.py freenove-esp32s3-display-2.8-lcd

      - name: Upload merged binary
        uses: actions/upload-artifact@v4
        with:
          name: freenove-esp32s3-display-2.8-firmware
          path: build/merged-binary.bin

      - name: Upload app binary
        uses: actions/upload-artifact@v4
        with:
          name: freenove-esp32s3-display-2.8-app
          path: build/xiaozhi.bin
